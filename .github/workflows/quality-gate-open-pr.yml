name: Quality Gate · Open PR
on:
  push:
    branches-ignore:
      - "main"
      - 'quality-gate/install-**'
permissions: {}
concurrency:
  group: quality-gate-open-pr-${{ github.ref }}
  cancel-in-progress: false
jobs:
  open-pr:
    if: github.event.repository.private == false && github.event.deleted == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Open or reuse pull request
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branch=context.ref.slice('refs/heads/'.length);
            if(branch==="main" || branch.startsWith('quality-gate/install-')) return;
            const comparison=await github.rest.repos.compareCommitsWithBasehead({owner,repo,basehead:"main"+'...'+branch});
            if(!comparison.data.ahead_by){core.info('No commits to propose');return;}
            const existing=await github.rest.pulls.list({owner,repo,state:'open',base:"main",head:owner+':'+branch,per_page:100});
            if(existing.data.length){core.info('Using PR #'+existing.data[0].number);return;}
            // The repository setting must allow GitHub Actions to create pull requests.
            const result=await github.rest.pulls.create({owner,repo,head:branch,base:"main",title:branch,body:'Opened automatically after a development branch push. Automated Quality Gate will review the changes. Review the results and merge when ready.'});
            core.info('Opened PR #'+result.data.number);
